<!doctype html>
<html lang="en"><head><meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#000000">
<title>Hey Muse (voice)</title>
<style>
  html, body { margin: 0; height: 100%; background: #000; color: #f2efe9; font: 18px/1.4 -apple-system, system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
  main { box-sizing: border-box; min-height: 100%; padding: 24px 20px calc(24px + env(safe-area-inset-bottom)); display: flex; flex-direction: column; gap: 18px; }
  #start { font: inherit; font-size: 28px; font-weight: 700; padding: 32px 16px; border: 0; border-radius: 20px; background: #7bd88f; color: #000; }
  #start[hidden] { display: none; }
  #state { font-size: 40px; font-weight: 700; line-height: 1.15; }
  #msg { color: #ffb86b; min-height: 1.4em; }
  .label { font-size: 13px; text-transform: uppercase; letter-spacing: .08em; color: #8d877d; margin-bottom: 4px; }
  #q, #a { white-space: pre-wrap; overflow-wrap: anywhere; }
  #q { color: #b9b3a8; }
  label { display: block; font-size: 14px; color: #8d877d; }
  input { box-sizing: border-box; width: 100%; margin-top: 6px; padding: 12px; font: inherit; border-radius: 10px; border: 1px solid #3a362f; background: #14110f; color: inherit; }
</style></head>
<body><main>
  <button id="start">Start</button>
  <div id="state" aria-live="polite">Tap Start</div>
  <div id="msg" role="status"></div>
  <div><div class="label">You asked</div><div id="q">-</div></div>
  <div><div class="label">Answer</div><div id="a">-</div></div>
  <label>Token<input id="token" type="password" autocomplete="off" autocapitalize="off" spellcheck="false"></label>
</main>
<script type="module" src="/src/voice-main.ts"></script></body></html>
