<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <radialGradient id="bg" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#173326"/>
      <stop offset="0.55" stop-color="#0d1a14"/>
      <stop offset="1" stop-color="#070b09"/>
    </radialGradient>
    <filter id="glow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="9" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3"/></filter>
    <clipPath id="lensL"><rect x="166" y="196" width="78" height="56" rx="20"/></clipPath>
    <clipPath id="lensR"><rect x="268" y="196" width="78" height="56" rx="20"/></clipPath>
    <linearGradient id="hair" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b2418"/><stop offset="1" stop-color="#24150e"/></linearGradient>
    <linearGradient id="shirt" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#2f5d7c"/><stop offset="1" stop-color="#1f3d55"/></linearGradient>
  </defs>
  <rect width="512" height="512" rx="96" fill="url(#bg)"/>

  <!-- hair, back -->
  <path d="M256 92 C170 92 128 158 132 238 C134 300 126 352 104 398 L408 398 C386 352 378 300 380 238 C384 158 342 92 256 92 Z" fill="url(#hair)"/>
  <!-- shoulders -->
  <path d="M96 512 C100 430 160 392 214 382 L298 382 C352 392 412 430 416 512 Z" fill="url(#shirt)"/>
  <!-- neck -->
  <path d="M226 318 L286 318 L292 392 C270 404 242 404 220 392 Z" fill="#d79c76"/>
  <!-- ears -->
  <ellipse cx="160" cy="236" rx="15" ry="22" fill="#e3aa83"/>
  <ellipse cx="352" cy="236" rx="15" ry="22" fill="#e3aa83"/>
  <!-- face -->
  <path d="M256 128 C318 128 352 172 352 236 C352 300 312 350 256 350 C200 350 160 300 160 236 C160 172 194 128 256 128 Z" fill="#efbc95"/>
  <!-- bangs -->
  <path d="M160 214 C158 150 202 112 262 114 C318 116 356 152 354 214 C334 180 300 160 262 158 C230 168 196 186 160 214 Z" fill="url(#hair)"/>
  <!-- cheeks -->
  <ellipse cx="196" cy="282" rx="18" ry="10" fill="#f2a08a" opacity="0.45"/>
  <ellipse cx="316" cy="282" rx="18" ry="10" fill="#f2a08a" opacity="0.45"/>

  <!-- green light from the lenses on her face -->
  <ellipse cx="205" cy="262" rx="44" ry="18" fill="#39ff5a" opacity="0.12" filter="url(#soft)"/>
  <ellipse cx="307" cy="262" rx="44" ry="18" fill="#39ff5a" opacity="0.12" filter="url(#soft)"/>
  <!-- lens glow -->
  <g filter="url(#glow)" opacity="0.55">
    <rect x="160" y="190" width="90" height="68" rx="24" fill="#39ff5a" opacity="0.35"/>
    <rect x="262" y="190" width="90" height="68" rx="24" fill="#39ff5a" opacity="0.35"/>
  </g>
  <g filter="url(#glow)" opacity="0.9">
    <rect x="166" y="196" width="78" height="56" rx="20" fill="#39ff5a" opacity="0.28"/>
    <rect x="268" y="196" width="78" height="56" rx="20" fill="#39ff5a" opacity="0.28"/>
  </g>
  <!-- lens HUD lines -->
  <g clip-path="url(#lensR)" stroke="#9dffb0" stroke-width="4" stroke-linecap="round" opacity="0.95">
    <line x1="280" y1="212" x2="318" y2="212"/>
    <line x1="280" y1="224" x2="334" y2="224"/>
    <line x1="280" y1="236" x2="306" y2="236"/>
  </g>
  <g clip-path="url(#lensL)" stroke="#9dffb0" stroke-width="4" stroke-linecap="round" opacity="0.6">
    <line x1="178" y1="212" x2="214" y2="212"/>
    <line x1="178" y1="224" x2="230" y2="224"/>
  </g>
  <!-- eyes, seen through the lenses -->
  <ellipse cx="205" cy="232" rx="8" ry="9" fill="#2a1a12" opacity="0.85"/>
  <ellipse cx="307" cy="232" rx="8" ry="9" fill="#2a1a12" opacity="0.85"/>
  <!-- frames -->
  <g fill="none" stroke="#141414" stroke-width="7" stroke-linejoin="round">
    <rect x="166" y="196" width="78" height="56" rx="20"/>
    <rect x="268" y="196" width="78" height="56" rx="20"/>
    <path d="M244 214 C252 206 260 206 268 214"/>
    <path d="M166 214 L148 210"/>
    <path d="M346 214 L364 210"/>
  </g>
  <!-- smile, open (talking) -->
  <path d="M236 292 C246 316 266 316 276 292 C264 297 248 297 236 292 Z" fill="#8a3b33"/>


  <g transform="translate(108 356) scale(0.84) translate(-86 -345)">
  <!-- her words: a light bubble, left -->
  <g>
    <path d="M30 300 h112 a24 24 0 0 1 24 24 v34 a24 24 0 0 1 -24 24 h-58 l-26 22 l4 -22 h-32 a24 24 0 0 1 -24 -24 v-34 a24 24 0 0 1 24 -24 z" fill="#e9eef2" transform="translate(0 0)"/>
    <circle cx="62" cy="341" r="8" fill="#5b6773"/>
    <circle cx="86" cy="341" r="8" fill="#5b6773"/>
    <circle cx="110" cy="341" r="8" fill="#5b6773"/>
  </g>
  </g>
  <g transform="translate(402 340) scale(0.84) translate(-426 -335)">
  <!-- the answer: a glowing green bubble, right (like the lens) -->
  <g filter="url(#glow)">
    <path d="M370 288 h112 a24 24 0 0 1 24 24 v34 a24 24 0 0 1 -24 24 h-32 l4 22 l-26 -22 h-58 a24 24 0 0 1 -24 -24 v-34 a24 24 0 0 1 24 -24 z" fill="#0f2a1b" stroke="#39ff5a" stroke-width="5"/>
  </g>
  <g stroke="#9dffb0" stroke-width="7" stroke-linecap="round">
    <line x1="374" y1="315" x2="446" y2="315"/>
    <line x1="374" y1="333" x2="476" y2="333"/>
    <line x1="374" y1="351" x2="426" y2="351"/>
  </g>
  </g>
</svg>
